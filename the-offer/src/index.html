<!doctype html>
<html><head><meta charset="utf-8"><title>The Offer</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter.ttf") format("truetype"); font-weight: 100 900; }
@font-face { font-family: "Instrument Serif"; src: url("../fonts/InstrumentSerif-Regular.ttf") format("truetype"); font-style: normal; }
@font-face { font-family: "Instrument Serif"; src: url("../fonts/InstrumentSerif-Italic.ttf") format("truetype"); font-style: italic; }

canvas { display: block; max-width: 100vw; max-height: 100vh; }

<body><canvas id="gl"></canvas>
<script type="module">
await Promise.all([
  document.fonts.load('200 100px "Inter"'), document.fonts.load('600 20px "Inter"'),
  document.fonts.load('60px "Instrument Serif"'), document.fonts.load('italic 60px "Instrument Serif"'),
]);
try { await import('./render.js'); } catch (e) { window.ERROR = String(e && e.stack || e); }
